name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # 顺序即门禁：类型不过就别跑测试，测试不过就别发版
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
